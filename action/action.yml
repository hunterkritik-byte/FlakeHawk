name: FlakeHawk
description: Ingest JUnit reports with GitHub Actions metadata.
branding:
  icon: activity
  color: purple

inputs:
  reports:
    description: File or directory containing JUnit XML reports.
    required: true
  output:
    description: JSONL ingestion store path.
    required: false
    default: .flakehawk/runs.jsonl
  version:
    description: Release tag to install.
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Install FlakeHawk
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          Windows) os=windows ;;
          *) echo "Unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "Unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        asset="flakehawk_${os}_${arch}.tar.gz"
        if [ "$VERSION" = "latest" ]; then
          url="https://github.com/hunterkritik-byte/FlakeHawk/releases/latest/download/$asset"
        else
          url="https://github.com/hunterkritik-byte/FlakeHawk/releases/download/$VERSION/$asset"
        fi
        mkdir -p "$RUNNER_TEMP/flakehawk"
        curl -fsSL "$url" -o "$RUNNER_TEMP/flakehawk.tar.gz"
        tar -xzf "$RUNNER_TEMP/flakehawk.tar.gz" -C "$RUNNER_TEMP/flakehawk"
        echo "$RUNNER_TEMP/flakehawk" >> "$GITHUB_PATH"
    - name: Ingest JUnit reports
      shell: bash
      run: flakehawk ingest --output "${{ inputs.output }}" "${{ inputs.reports }}"
